services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db-recipe-book
      MYSQL_USER: recipe-book
      MYSQL_PASSWORD: recipe-book-pwd
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: recipe-book
      DB_PASSWORD: recipe-book-pwd
      DB_NAME: db-recipe-book
    volumes:
      - ./server/src:/app/src
      - ./server/tsconfig.json:/app/tsconfig.json

volumes:
  mysql_data:
